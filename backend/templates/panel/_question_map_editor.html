{% load static %}
<section class="map-editor-box" id="map-question-editor"
         data-map-src="{% static 'content/maps/turkiye_goller.png' %}"
         data-provinces-src="{% static 'content/maps/turkiye_iller.json' %}">
  <div class="media-title">Harita sorusu</div>
  <p class="media-hint">Şablonu seçin. <strong>İl boya</strong> ile haritadaki ili boya kutusu gibi doldurun (aynı rengi komşu illere basınca bölge birleşir). Elips/daire işaret; elipsi yeşil tutaçla döndürün. Soru metninde haritanın yerine <code>[HARITA]</code> yazın.</p>
  <div class="map-editor-actions map-editor-actions-top">
    <button type="button" class="btn btn-ghost" id="map-insert-placeholder">Metne [HARITA] ekle</button>
  </div>
  <label>Harita şablonu
    <select name="map_template" id="map-template">
      <option value="">Harita yok</option>
      {% for map_id, map_title in map_template_choices %}
      {% if map_id %}
      <option value="{{ map_id }}" {% if question and question.map_template == map_id %}selected{% endif %}>{{ map_title }}</option>
      {% endif %}
      {% endfor %}
    </select>
  </label>
  <input type="hidden" name="map_markers" id="map-markers" value="[]">
  <div class="map-editor-body" id="map-editor-body" hidden>
    <div class="map-canvas-wrap" id="map-canvas-wrap">
      <img src="{% static 'content/maps/turkiye_goller_editor.png' %}"
           alt="İl sınırlı ve isimli düzenleme haritası (Tuz Gölü ve Van Gölü)"
           id="map-base-image" draggable="false">
      <svg class="map-fill-layer" id="map-fill-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="map-marker-layer" id="map-marker-layer"></div>
    </div>
    <div class="map-editor-actions">
      <button type="button" class="btn btn-ghost" id="map-paint-toggle">İl boya</button>
      <label class="map-fill-color" id="map-fill-color-wrap" hidden>
        Boya rengi
        <input type="color" id="map-fill-color" value="#111827">
      </label>
      <button type="button" class="btn btn-primary" id="map-add-marker">Elips ekle</button>
      <button type="button" class="btn btn-ghost" id="map-add-circle">Daire ekle</button>
      <button type="button" class="btn btn-ghost" id="map-clear-markers">Tümünü sil</button>
      <span class="media-hint" id="map-editor-status"></span>
    </div>
    <div class="map-marker-controls" id="map-marker-controls"></div>
  </div>
</section>
