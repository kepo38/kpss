{% extends "panel/base.html" %}
{% block content %}
<header class="page-header">
  <h1>Dersler</h1>
  <p class="lead">Bir ders seçin — konular, bilgi kartları ve sorular o derse bağlı açılır.</p>
</header>
<div class="grid">
  {% for s in subjects %}
  <a class="card" href="{% url 'panel_subject' s.id %}">
    <strong>{{ s.name }}</strong>
    <div class="meta">{{ s.topics.count }} konu</div>
  </a>
  {% empty %}
  <div class="empty">Henüz ders yok. Önce <code>seed_curriculum</code> çalıştırın.</div>
  {% endfor %}
</div>
{% endblock %}
