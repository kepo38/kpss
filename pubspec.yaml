name: kpss_akademi
description: Hedef Kamu - Premium KPSS hazırlık mobil uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  google_mobile_ads: ^9.0.0
  connectivity_plus: ^6.1.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  intl: ^0.20.2
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.3.6
  shared_preferences: ^2.3.5
  http: ^1.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  sqflite_common_ffi: ^2.3.4
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2
  audioplayers: ^6.4.0
  flutter_native_splash: ^2.4.0
  flutter_math_fork: ^0.7.4
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#0C1424"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  adaptive_icon_foreground_inset: 12
  min_sdk_android: 21

flutter_native_splash:
  color: "#0C1424"
  fullscreen: true
  android_12:
    color: "#0C1424"
  android: true
  ios: false
  web: false
